<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="streakA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#9B5CF0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="streakB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="630" cy="512" r="210"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="#0B1020"/>

  <!-- everything tilted so the ball flies up and to the right -->
  <g transform="rotate(-20 630 512)">
    <!-- speed streaks -->
    <rect x="190" y="372" width="300" height="34" rx="17" fill="url(#streakB)"/>
    <rect x="130" y="495" width="360" height="34" rx="17" fill="url(#streakA)"/>
    <rect x="230" y="618" width="260" height="34" rx="17" fill="url(#streakB)"/>

    <!-- ball -->
    <circle cx="630" cy="512" r="210" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)" fill="none" stroke="#0B1020" stroke-width="13" stroke-linecap="round">
      <line x1="630" y1="290" x2="630" y2="734"/>
      <line x1="410" y1="512" x2="850" y2="512"/>
      <circle cx="285" cy="512" r="220"/>
      <circle cx="975" cy="512" r="220"/>
    </g>
    <circle cx="630" cy="512" r="210" fill="none" stroke="#0B1020" stroke-width="13"/>
  </g>
</svg>
